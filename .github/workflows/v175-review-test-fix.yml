name: Align v175 replacement evidence regression

on:
  push:
    branches:
      - feat/canonical-identity-ingestion-lifecycle-v175
    paths:
      - .github/workflows/v175-review-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/canonical-identity-ingestion-lifecycle-v175
          fetch-depth: 0
      - name: Align regression expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/canonical-ingestion-lifecycle-v175.test.js')
          text = path.read_text()
          old = "  assert.deepEqual(replacement.records[0].providerObservations.map((item) => item.providerEventId), ['tm-new']);"
          new = "  assert.deepEqual(replacement.records[0].providerObservations.map((item) => item.providerEventId), ['tm-old', 'tm-new']);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one replacement assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/v175-review-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/canonical-ingestion-lifecycle-v175.test.js
          git add -u .github/workflows/v175-review-test-fix.yml
          git commit -m "Align v175 replacement evidence regression"
          git push origin HEAD:feat/canonical-identity-ingestion-lifecycle-v175
