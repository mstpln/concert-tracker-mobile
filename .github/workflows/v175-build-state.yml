name: Generate v175 build state

on:
  push:
    branches:
      - feat/canonical-identity-ingestion-lifecycle-v175

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate deterministic build state
        run: npm run state:generate
      - name: Commit generated state and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v175-build-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LIVEVAULT_BUILD_STATE.json .github/workflows/v175-build-state.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate v175 build state"
          git push origin HEAD:feat/canonical-identity-ingestion-lifecycle-v175
