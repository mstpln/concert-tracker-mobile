name: Apply approved provider identities
run-name: Apply approved provider identities — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      APPLY_APPROVED_IDENTITIES:
        description: Confirm this one-time run may update five approved identities in bands.json
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  apply-approved-provider-identities:
    if: ${{ inputs.APPLY_APPROVED_IDENTITIES == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Apply five approved provider identities
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: node scripts/apply-approved-provider-identities.js
