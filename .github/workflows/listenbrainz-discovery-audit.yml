name: ListenBrainz discovery coverage audit

on:
  push:
    branches:
      - audit/listenbrainz-discovery-coverage

permissions:
  contents: read

jobs:
  read-only-audit:
    name: Read-only ListenBrainz coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate audit script without network
        run: |
          node --check scripts/listenbrainz-discovery-audit.js
          node scripts/listenbrainz-discovery-audit.js --self-test

      - name: Run authorized read-only coverage audit
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: |
          mkdir -p .audit
          node scripts/listenbrainz-discovery-audit.js --output .audit/listenbrainz-discovery-audit.json

      - name: Upload anonymized audit result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listenbrainz-discovery-audit
          path: .audit/listenbrainz-discovery-audit.json
          if-no-files-found: error
          retention-days: 7
