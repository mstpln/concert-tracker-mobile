name: Clean legacy release feed

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN_LEGACY_RELEASE_FEED to authorize the production cleanup'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Back up and clean release feed
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          RELEASE_FEED_BACKUP_PATH: news-before-v77-cleanup.json
          RELEASE_FEED_CLEANUP_CONFIRM: ${{ inputs.confirm }}
        run: node scripts/cleanupReleaseFeed.js

      - name: Upload rollback backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-before-v77-cleanup
          path: news-before-v77-cleanup.json
          retention-days: 30
          if-no-files-found: error
