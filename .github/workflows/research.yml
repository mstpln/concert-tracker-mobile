name: Structured concert and release research

on:
  schedule:
    # 01:00 UTC Monday, Wednesday and Friday.
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run structured provider pipeline
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: node scripts/run-with-scheduler-lease.js structured-research -- node -r ./scripts/preloadStructuredRun.js scripts/research.js
