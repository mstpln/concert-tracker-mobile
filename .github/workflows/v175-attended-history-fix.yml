name: Correct v175 attended history protection

on:
  push:
    branches:
      - feat/canonical-identity-ingestion-lifecycle-v175

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct attended-history detection and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/lib/canonicalConcertIngestionV175.js')
          text = path.read_text()
          old = "  const attendedHistorical = output.attended === true;"
          new = """  const activeDate = text(output.date);
            const currentDate = text(now).slice(0, 10);
            const attendedHistorical = output.attended === true
              || (output.attending === true && /^\\d{4}-\\d{2}-\\d{2}$/.test(activeDate) && activeDate < currentDate);"""
          if old not in text:
              raise SystemExit('attended-history target not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('test/canonical-ingestion-lifecycle-v175.test.js')
          tests = test_path.read_text()
          marker = "test('v175 ambiguous or weak replacement continuity fails closed'"
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          regression = """test('v175 legacy attending past concerts are immutable historical attendance', () => {
            const existing = stored({
              date: '2025-10-10', attending: true, attended: undefined,
              sourceProvider: 'ticketmaster', providerEventId: 'tm-old',
            });
            const changed = Ingestion.ingestCandidate([existing], observation({
              providerEventId: 'tm-old', date: '2026-11-12',
            }), options).records[0];
            assert.equal(changed.date, '2025-10-10');
            assert.equal(changed.lifecycleHistory[0].type, 'provider_date_conflict');
          });

          """
          test_path.write_text(tests.replace(marker, regression + marker, 1))
          PY
      - name: Focused v175 regression tests
        run: TZ=UTC node --test test/canonical-ingestion-lifecycle-v175.test.js test/ticketmaster-data-integrity-v163.test.js
      - name: Syntax and build state
        run: npm run qa:syntax && npm run state:check
      - name: Commit correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v175-attended-history-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/canonicalConcertIngestionV175.js test/canonical-ingestion-lifecycle-v175.test.js .github/workflows/v175-attended-history-fix.yml
          git commit -m "Protect legacy attended concert dates in v175"
          git push origin HEAD:feat/canonical-identity-ingestion-lifecycle-v175
