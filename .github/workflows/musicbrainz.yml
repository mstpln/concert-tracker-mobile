name: MusicBrainz artist identity backfill
run-name: MusicBrainz artist identity backfill — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm that this will check up to five artists and may update bands.json
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  musicbrainz-backfill:
    if: ${{ inputs.confirm == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run MusicBrainz artist identity backfill
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: node scripts/run-with-scheduler-lease.js musicbrainz-identity-backfill -- node scripts/musicbrainz-backfill.js
