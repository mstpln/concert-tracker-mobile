name: Restore v175 checkpoint

on:
  push:
    branches:
      - feat/canonical-identity-ingestion-lifecycle-v175

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore checkpoint patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .v175-checkpoint.patch.gz.b64 | gzip -d > /tmp/v175.patch
          git apply --check /tmp/v175.patch
          git apply /tmp/v175.patch
          rm -f .v175-checkpoint.patch.gz.b64
          rm -f .github/workflows/v175-checkpoint-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore canonical ingestion and lifecycle checkpoint (v175)"
          git push origin HEAD:feat/canonical-identity-ingestion-lifecycle-v175
