name: Spotify album artwork maintenance
run-name: Spotify album artwork maintenance — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      RUN_ALBUM_ARTWORK_MAINTENANCE:
        description: Confirm this run may read private listening data, call Spotify, and write listening artwork metadata
        required: true
        type: boolean
        default: false
      ALBUM_GROUP_CAP:
        description: Maximum unresolved album groups to process in this invocation (1-25)
        required: true
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  spotify-album-artwork-maintenance:
    if: ${{ inputs.RUN_ALBUM_ARTWORK_MAINTENANCE == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Validate album-group cap
        env:
          ALBUM_GROUP_CAP: ${{ inputs.ALBUM_GROUP_CAP }}
        run: |
          set -euo pipefail
          if ! [[ "$ALBUM_GROUP_CAP" =~ ^[0-9]+$ ]] || [ "$ALBUM_GROUP_CAP" -lt 1 ] || [ "$ALBUM_GROUP_CAP" -gt 25 ]; then
            echo "ALBUM_GROUP_CAP must be an integer from 1 to 25."
            exit 1
          fi

      - name: Run album-oriented Spotify artwork maintenance
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_BROWSER_TOKEN: ${{ secrets.CF_WORKER_BROWSER_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          LIVEVAULT_BACKFILL_CONFIRM: I_AUTHORIZE_PRIVATE_LISTENING_READS_LIVE_SPOTIFY_CALLS_AND_PROVIDER_USAGE_WRITES
          LIVEVAULT_BACKFILL_WRITE_CONFIRM: I_AUTHORIZE_PRODUCTION_SPOTIFY_METADATA_WRITES
          ALBUM_GROUP_CAP: ${{ inputs.ALBUM_GROUP_CAP }}
        run: node scripts/spotify-album-artwork-production.js --execute --write --cap "$ALBUM_GROUP_CAP" --delay-ms 1000 --market SE
