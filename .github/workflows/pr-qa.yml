name: PR QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-and-safety:
    name: Unit and safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: |
          mkdir -p test-results
          set +e
          npm run test 2>&1 | tee test-results/unit.log
          status=${PIPESTATUS[0]}
          node <<'NODE' 2>&1 | tee -a test-results/unit.log
          const Migration = require('./scripts/lib/canonicalMigrationV176');
          const venues = [
            { venueId: 'venue-main', name: 'Main Hall', currentName: 'Main Hall', city: 'Malmo', country: 'Sweden', address: 'Main Street 1', identityAliases: ['Main Hall Arena'], providerIdentities: [{ provider: 'ticketmaster', providerVenueId: 'tm-main', name: 'Main Hall' }] },
            { venueId: 'venue-room', name: 'Main Hall Room 2', city: 'Malmo', country: 'Sweden', address: 'Main Street 1', customFutureVenueField: 'preserve-me' },
            { venueId: 'venue-other', name: 'Other Arena', city: 'Copenhagen', country: 'Denmark', address: 'Other Street 2' },
          ];
          const base = (overrides = {}) => ({ id: 'concert-user', bandId: 'band-1', bandName: 'Band One', date: '2026-10-10', venue: 'Main Hall', city: 'Malmo', country: 'Sweden', venueAddress: 'Main Street 1', canonicalVenueId: 'venue-main', attending: true, ticketPrice: 500, ticketQuantity: 1, freeTicket: false, notes: 'Keep this note', lineupRole: 'headliner', manuallyAdded: true, customFutureConcertField: 'keep-me', ...overrides });
          const plan = Migration.planMigration(venues, [
            base({ id: 'concert-room-listing', canonicalVenueId: 'venue-room', venue: 'Main Hall Room 2', roomOrStage: { name: 'Room 2', type: 'room' }, attending: false, ticketPrice: undefined, notes: undefined, manuallyAdded: false }),
            base({ id: 'concert-main-listing' }),
          ], { venueMerges: [{ ids: ['venue-main', 'venue-room'], canonicalId: 'venue-main', reason: 'researched_parent_room' }] });
          console.log('V176_TRACE', JSON.stringify({
            legacyVenueMap: plan.legacyVenueMap,
            blocked: plan.blocked,
            unresolved: plan.unresolved,
            concerts: plan.concerts.map((record) => ({ id: record.id, bandId: record.bandId, date: record.date, canonicalVenueId: record.canonicalVenueId, venue: record.venue, roomOrStage: record.roomOrStage })),
            groups: Migration.migrationEventGroups(plan.venues, plan.concerts).map((group) => ({ key: group.key, relationship: group.relationship, ids: group.records.map((record) => record.id), validation: group.validation })),
          }));
          NODE
          exit "$status"
      - name: JavaScript syntax
        run: npm run qa:syntax
      - name: Version and cache synchronization
        run: npm run qa:version
      - name: Workflow YAML validation
        run: npm run qa:workflows
      - name: Cloudflare Builds configuration
        run: npm run qa:cloudflare-builds
      - name: Synthetic fixture validation
        run: npm run qa:fixtures
      - name: Deterministic build state
        run: npm run state:check
      - name: Build synthetic QA preview
        run: npm run build:qa
        env:
          QA_BUILD_ID: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: QA safety checks
        run: npm run qa:safety
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Whitespace validation
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-and-safety-artifacts
          path: |
            dist/qa-build.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop Chromium QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build synthetic QA preview
        run: npm run build:qa
        env:
          QA_BUILD_ID: pr-${{ github.event.pull_request.number }}-${{ github.sha }}-desktop
      - name: Run desktop Chromium QA
        run: npx playwright test --project=desktop-chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-chromium-artifacts
          path: |
            playwright-report/
            test-results/
            dist/qa-build.json
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile Chromium QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build synthetic QA preview
        run: npm run build:qa
        env:
          QA_BUILD_ID: pr-${{ github.event.pull_request.number }}-${{ github.sha }}-mobile
      - name: Run mobile Chromium QA
        run: npx playwright test --project=mobile-chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-chromium-artifacts
          path: |
            playwright-report/
            test-results/
            dist/qa-build.json
          if-no-files-found: ignore
          retention-days: 14
