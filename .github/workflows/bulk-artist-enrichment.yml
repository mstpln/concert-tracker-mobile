name: Bulk artist enrichment

on:
  push:
    branches:
      - feature/bulk-artist-enrichment
    paths:
      - '.github/workflows/bulk-artist-enrichment.yml'
      - 'scripts/bulk-enrich-artists.py'
      - 'scripts/fill-missing-artist-metadata.py'
      - 'scripts/data/approved-artists.json'
      - 'scripts/data/reviewed-artist-overrides.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-vault-bulk-artist-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    name: Build review-only bands.json candidate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3

      - name: Download current production bands baseline (GET only)
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_WORKER_ENDPOINT"
          test -n "$CF_WORKER_TOKEN"
          mkdir -p out
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CF_WORKER_TOKEN" \
            "${CF_WORKER_ENDPOINT%/}/bands.json" \
            --output out/bands-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('out/bands-baseline.json').read_text(encoding='utf-8'))
          if not isinstance(value, list):
              raise SystemExit('bands.json must contain an array')
          print(f'Loaded {len(value)} existing band records')
          PY

      - name: Run bulk enrichment
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/bulk-enrich-artists.py \
            --input out/bands-baseline.json \
            --artists scripts/data/approved-artists.json \
            --output out/bands-enriched.json \
            --report out/bulk-artist-enrichment-report.json

      - name: Apply reviewed metadata and Spotify fallbacks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/fill-missing-artist-metadata.py \
            --bands out/bands-enriched.json \
            --report out/bulk-artist-enrichment-report.json \
            --overrides scripts/data/reviewed-artist-overrides.json

      - name: Verify existing records are preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('out/bands-baseline.json').read_text(encoding='utf-8'))
          after = json.loads(Path('out/bands-enriched.json').read_text(encoding='utf-8'))
          before_by_name = {item.get('name'): item for item in before}
          after_by_name = {item.get('name'): item for item in after[:len(before)]}
          for name, original in before_by_name.items():
              candidate = after_by_name.get(name)
              if candidate is None:
                  raise SystemExit(f'existing record missing or reordered: {name}')
              if name == 'Macklemore':
                  for key, value in original.items():
                      if candidate.get(key) != value:
                          raise SystemExit(f'Macklemore existing field changed: {key}')
                  continue
              if candidate != original:
                  raise SystemExit(f'existing production record changed: {name}')
          ids = [item.get('id') for item in after]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate IDs found in enriched output')
          print(f'Output records: {len(after)}')
          PY

      - name: Create run summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('out/bulk-artist-enrichment-report.json')
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding='utf-8'))
          remaining = report.get('remainingMissing') or {}
          lines = [
              '# Live Vault bulk artist enrichment',
              '',
              f"- Existing records: {report['inputCount']}",
              f"- Added records: {report['addedCount']}",
              f"- Candidate output records: {report['outputCount']}",
              f"- Unresolved artists: {report['unresolvedCount']}",
              f"- Validation errors: {len(report['validationErrors'])}",
              f"- Remaining missing Spotify: {remaining.get('missingSpotify', 'n/a')}",
              f"- Remaining missing images: {remaining.get('missingPhotoUrl', 'n/a')}",
              f"- Remaining missing genres: {remaining.get('missingGenre', 'n/a')}",
              f"- Remaining missing bios: {remaining.get('missingBio', 'n/a')}",
              '',
              'This workflow performs no PUT, POST, DELETE, deployment, merge, or production write.',
              'The generated files are review-only workflow artifacts.',
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + '\n')
          PY

      - name: Upload candidate and audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-vault-bulk-artist-enrichment-${{ github.run_id }}
          path: |
            out/bands-enriched.json
            out/bulk-artist-enrichment-report.json
          if-no-files-found: error
          retention-days: 14
