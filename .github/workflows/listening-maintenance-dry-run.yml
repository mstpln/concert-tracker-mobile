name: Listening maintenance dry run
run-name: Listening maintenance synthetic dry run — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      RUN_SYNTHETIC_DRY_RUN:
        description: Run the synthetic-only listening maintenance fixture
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listening-maintenance-dry-run:
    if: ${{ inputs.RUN_SYNTHETIC_DRY_RUN == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run synthetic listening maintenance
        run: node scripts/listening-maintenance-dry-run.js
