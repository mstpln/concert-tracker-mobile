name: Focused Tavily concert research

on:
  schedule:
    # Twice monthly. Adaptive per-band backoff determines which artists are due.
    - cron: '0 2 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run focused concert web research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: node scripts/run-with-scheduler-lease.js focused-tavily-concert -- node scripts/tavilyConcertRun.js

      - name: Run attended venue metadata research
        if: ${{ vars.VENUE_METADATA_RESEARCH_ENABLED == 'true' }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          DATA_MAINTENANCE_TOKEN: ${{ secrets.DATA_MAINTENANCE_TOKEN }}
        run: node scripts/run-with-scheduler-lease.js venue-metadata-research -- node scripts/venueMetadataResearchRun.js
