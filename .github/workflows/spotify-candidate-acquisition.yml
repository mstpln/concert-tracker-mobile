name: Spotify candidate acquisition
run-name: Spotify candidate acquisition — @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      ACQUIRE_SPOTIFY_CANDIDATES:
        description: Confirm this review-only run may update Spotify candidates in bands.json
        required: true
        type: boolean
        default: false
      BAND_CAP:
        description: Maximum bands to inspect in this run (1-25)
        required: true
        type: number
        default: 25

permissions:
  contents: read

concurrency:
  group: live-vault-data-writes
  cancel-in-progress: false

jobs:
  spotify-candidate-acquisition:
    if: ${{ inputs.ACQUIRE_SPOTIFY_CANDIDATES == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run review-only Spotify candidate acquisition
        env:
          CF_WORKER_ENDPOINT: ${{ secrets.CF_WORKER_ENDPOINT }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_CANDIDATE_BAND_CAP: ${{ inputs.BAND_CAP }}
        run: node scripts/run-with-scheduler-lease.js spotify-candidate-acquisition -- node scripts/spotify-candidate-acquisition.js
